<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>流媒体数据可视化</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <!-- D3 v7：后续阶段绘制图表时使用 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="page-header" id="page-header">
          <h1 class="page-title" id="page-title">流媒体数据可视化</h1>
          <p class="page-subtitle">探索不同平台、类型与地区的内容分布趋势</p>
        </header>

        <section class="control-panel" id="control-panel" aria-label="筛选面板">
          <div class="year-filter-wrap">
            <label class="slider-label" for="year-slider">
              年份：<span class="slider-value" id="year-slider-value">2024</span>
            </label>
            <input
              type="range"
              id="year-slider"
              class="year-slider"
              min="2015"
              max="2024"
              value="2024"
              step="1"
            />
          </div>
          <div id="global-filter-panel"></div>
        </section>
      </aside>

      <main class="main-content">
        <div class="charts-grid">
          <section class="chart-panel" id="new-bubble-chart-panel" aria-label="平台地区气泡图">
            <h2 class="chart-panel__title">平台内容地区分布</h2>
            <div class="chart-panel__body chart-panel__body--new-bubble" id="new-bubble-chart-container"></div>
          </section>

          <section class="chart-panel" id="new-radar-chart-panel" aria-label="内容类型雷达图">
            <h2 class="chart-panel__title">平台内容类型对比</h2>
            <div class="chart-panel__body chart-panel__body--new-radar" id="new-radar-chart-container"></div>
          </section>

          <section
            class="chart-panel chart-panel--stacked"
            id="stacked-bar-panel"
            aria-label="堆叠柱状图"
          >
            <h2 class="chart-panel__title">热门地区电影与剧集数量前 10</h2>
            <div class="chart-panel__body chart-panel__body--stacked" id="stacked-bar-container"></div>
          </section>

          <section
            class="chart-panel chart-panel--parallel"
            id="parallel-coords-panel"
            aria-label="平行坐标图"
          >
            <h2 class="chart-panel__title">内容分级、时长、年份与类型对比</h2>
            <p class="chart-panel__desc">
              每条线代表一部影视作品，用于比较内容分级、时长、上线年份和类型之间的关系。
            </p>
            <div class="chart-panel__body chart-panel__body--parallel" id="parallel-coords-container"></div>
          </section>
        </div>
      </main>
    </div>

    <!-- 顺序：状态 → 数据加载器 → 控件/图表 → 入口 -->
    <script src="js/filters.js"></script>
    <script src="js/dataLoader.js"></script>
    <script src="js/tooltip.js"></script>
    <script src="js/filterPanel.js"></script>
    <script src="js/yearSlider.js"></script>
    <script src="js/newBubbleChart.js"></script>
    <script src="js/newRadarChart.js"></script>
    <script src="js/stackedBar.js"></script>
    <script src="js/parallelCoords.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
